name: Build Smart Mobile Codes APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify source archive and remote catalog
        run: |
          test -f smart-mobile-codes-main.zip
          test -f codes.json
          python3 -m json.tool codes.json > /dev/null

      - name: Extract Flutter source outside repository
        shell: bash
        run: |
          SOURCE_DIR="$RUNNER_TEMP/smart-mobile-codes-source"
          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -q smart-mobile-codes-main.zip -d "$SOURCE_DIR"
          mapfile -t manifests < <(find "$SOURCE_DIR" -mindepth 2 -maxdepth 5 -type f -name pubspec.yaml -print)
          if [[ ${#manifests[@]} -ne 1 ]]; then
            echo "Expected exactly one pubspec.yaml; found ${#manifests[@]}"
            find "$SOURCE_DIR" -name pubspec.yaml -print
            exit 1
          fi
          PROJECT_DIR="$(dirname "${manifests[0]}")"
          python3 - "$PROJECT_DIR" "$GITHUB_WORKSPACE" <<'PYTHON'
          from pathlib import Path
          import shutil, sys
          src, dst = Path(sys.argv[1]), Path(sys.argv[2])
          for item in src.iterdir():
              if item.name == '.github':
                  continue
              target = dst / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          PYTHON
          test -f pubspec.yaml
          test -d lib
          test -f test/widget_test.dart

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.smartmobilecodes --project-name smart_mobile_codes .

      - name: Apply safe Android release settings for WorkManager
        run: python3 tool/patch_android_release.py

      - name: Configure native Android home-screen widget
        run: python3 tool/configure_android_widget.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze source
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test --no-pub

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: smart-mobile-codes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
